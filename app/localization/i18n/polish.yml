help: |-
  <b>{}

  ⬇️ Jak pobierać torrenty?</b>

  Aby pobrać torrenty, musisz zainstalować dowolnego klienta torrent na swoim urządzeniu. Istnieje wielu klientów torrentów. Niektóre z moich ulubionych to qBitTorrent (na PC) i Flud (na Androida). Po zainstalowaniu wystarczy skopiować link magnetyczny lub załadować plik .Torrent do aplikacji, a torrent zacznie się pobierać.

  Ponadto możesz użyć internetowego klienta torrent, takiego jak seedr, który pobierze torrent za Ciebie. Korzystanie z klienta internetowego umożliwia oglądanie torrentów bez pobierania. Wystarczy założyć konto w seedr i skopiować tam link magnetyczny. Możesz pobrać plik lub przesłać go strumieniowo bezpośrednio do odtwarzacza VLC bez pobierania. Wolę używać klienta internetowego, takiego jak seedr, do pobierania torrentów.

  <b>Wyślij dowolne słowo klucz, aby wyszukać torrenty.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Aby wyszukać w trybie inline, po prostu wpisz @TorrentHuntBot na dowolnym czacie i wyszukaj torrenty.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
