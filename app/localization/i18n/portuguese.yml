help: |-
  <b>{}

  ⬇️ Como baixar torrents?</b>

  Para baixar os torrents, você precisa instalar qualquer cliente de torrent no seu dispositivo. Existem muitos clientes de torrent por aí. Alguns dos meus favoritos são qBitTorrent (para PC) e Flud (para android). Após a instalação, você só precisa copiar o link magnético ou carregar o arquivo .Torrent no aplicativo e o download do seu torrent deve começar.

  Além disso, você pode usar um cliente de torrent da web, como o seedr, que fará o download do torrent para você. Usar um cliente web permitirá que você assista a torrents sem fazer download. Você só precisa criar uma conta no seedr e copiar o link magnético para lá. Você pode baixar o arquivo ou transmiti-los diretamente para o player VLC sem fazer download. Eu prefiro usar um cliente web como o seedr para baixar torrents.

  <b>Envie qualquer palavra-chave para pesquisar torrents.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Para pesquisa inline, basta digitar @TorrentHuntBot em qualquer chat e pesquisar por torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
