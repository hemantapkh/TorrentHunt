greet: |-
  ✨ Salut {}, Je suis le bot Torrent Hunt et je peux vous aider à rechercher et à parcourir des torrents dans Telegram.

  <b>Saisissez des mots-clés pour rechercher des torrents.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Pour la recherche en ligne, tapez simplement @TorrentHuntBot dans n'importe quelle discussion et recherchez des torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
