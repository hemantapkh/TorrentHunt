help: |-
  <b>{}

  ⬇️ Comment télécharger des torrents ?</b>

  Pour télécharger des torrents, vous devez installer n'importe quel client torrent sur votre appareil. Il existe de nombreux clients torrent. Je recommande qBitTorrent (pour PC) et Flud (pour Android). Après l'installation, il vous suffit de copier le lien magnet ou d'ouvrir le fichier .Torrent dans l'application et votre torrent commencera à se télécharger.

  De plus, vous pouvez utiliser un client torrent Web, comme seedr, qui téléchargera le torrent pour vous. L'utilisation d'un client Web vous permettra de regarder des torrents sans téléchargement. Il vous suffit de créer un compte dans seedr et d'y copier le lien magnétique. Vous pouvez télécharger le fichier ou le diffuser directement dans le lecteur VLC sans le télécharger. Je préfère utiliser un client Web comme seedr pour télécharger des torrents.

  <b>Saisissez des mots-clés pour rechercher des torrents.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Pour la recherche en ligne, mentionnez simplement @TorrentHuntBot dans n'importe quelle discussion et recherchez des torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
