help: |-
  <b>{}

  ⬇️ ¿Cómo descargar torrents?</b>

  Para descargar los torrents, debe instalar cualquier cliente de torrent en su dispositivo. Hay muchos clientes de torrents por ahí. Algunos de mis favoritos son qBitTorrent (para PC) y Flud (para Android). Después de la instalación, solo necesita copiar el enlace magnético o cargar el archivo .Torrent en la aplicación y su torrent comenzará a descargarse.

  Además, puede utilizar un cliente web torrent, como seedr, que descargará el torrent por usted. El uso de un cliente web le permitirá ver torrents sin descargar. Solo necesita crear una cuenta en seedr y copiar el enlace magnético allí. Puede descargar el archivo o transmitirlo directamente al reproductor VLC sin descargarlo. Prefiero usar un cliente web como seedr para descargar torrents.

  <b>Envíe cualquier palabra clave para buscar torrents.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Para la búsqueda en línea, simplemente escriba @TorrentHuntBot en cualquier chat y busque torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
