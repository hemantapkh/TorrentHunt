help: |-
  <b>{}

  ⬇️ Bagaimana memuat turun torrents?</b>

  Untuk memuat turun torrents, anda perlu memasang klien torrent pada peranti anda. Terdapat banyak pelanggan torrent di luar sana. Beberapa kegemaran saya adalah qBitTorrent (Untuk PC) dan Flud (Untuk android). Selepas memasang, anda hanya perlu menyalin pautan magnet, atau memuatkan fail .Torrent ke dalam aplikasi dan torrent anda akan mula dimuat turun.

  Selain itu, anda boleh menggunakan klien torrent web, seperti seedr yang akan memuat turun torrent untuk anda. Menggunakan pelanggan web akan membolehkan anda menonton torrent tanpa memuat turun. Anda hanya perlu membuat akaun di seedr dan menyalin pautan magnet di sana. Anda boleh memuat turun fail atau mengalirkannya terus ke pemain VLC tanpa memuat turun. Saya lebih suka menggunakan pelanggan web seperti seedr untuk memuat turun torrents.

  <b>Hantarkan sebarang kata kunci untuk mencari torrents.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Untuk carian sebaris, ketik @TorrentHuntBot dalam mana-mana sembang dan cari torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
