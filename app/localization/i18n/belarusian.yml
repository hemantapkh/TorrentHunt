help: |-
  <b>{}

  ⬇️ Як спампаваць торэнты?</b>

  Каб загрузіць торэнты, вам трэба ўсталяваць любы торэнт-кліент на прыладзе. Там шмат кліентаў-торэнтаў. Некаторыя з маіх любімых - qBitTorrent (для ПК) і Flud (для Android). Пасля ўсталёўкі вам трэба проста скапіяваць магнітную спасылку альбо загрузіць у праграму файл .Torrent, і ваш торэнт пачне загружацца.

  Акрамя таго, вы можаце выкарыстоўваць вэб-торэнт-кліент, напрыклад seedr, які загрузіць торэнт за вас. Выкарыстанне вэб-кліента дазволіць вам глядзець торэнты без загрузкі. Вам проста трэба стварыць уліковы запіс у seedr і скапіяваць там спасылку на магніт. Вы можаце альбо загрузіць файл, альбо трансляваць іх непасрэдна ў плэер VLC без загрузкі. Я аддаю перавагу выкарыстоўваць вэб-кліент, напрыклад seedr, для загрузкі торэнтаў.

  <b>Адпраўляйце любыя ключавыя словы для пошуку торэнтаў.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Для ўбудаванага пошуку проста ўвядзіце @TorrentHuntBot у любым чаце і шукайце торэнты.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
