help: |-
  <b>{}

  ⬇️ How to download torrents?</b>

  To download the torrents, you need to install any torrent client on your device. There are many torrent clients out there. Some of my favorites are qBitTorrent (For PC) and Flud (For android). After installing, you just need to copy the magnet link, or load the .Torrent file into the app and your torrent shall begin to download.

  Furthermore, you can use a web torrent client, like seedr which will download the torrent for you. Using a web client will allow you to watch torrents without downloading. You just need to create an account in seedr and copy the magnet link there. You can either download the file or stream them directly into the VLC player without downloading. I prefer to use a web client like seedr to download torrents.

  <b>Send any keywords to search for torrents.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>For inline search, just type @TorrentHuntBot in any chat and search for torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
