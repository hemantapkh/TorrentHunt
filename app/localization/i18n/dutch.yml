help: |-
  <b>{}

  ⬇️ Hoe torrents te downloaden?</b>

  Om de torrents te downloaden, moet je een torrent-client op je apparaat installeren. Er zijn veel torrent-clients die er zijn. Enkele van mijn favorieten zijn qBitTorrent (voor pc) en Flud (voor Android). Na het installeren hoef je alleen maar de magneetlink te kopiëren of het .Torrent-bestand in de app te laden en je torrent zal beginnen met downloaden.

  Verder kun je een web-torrent-client gebruiken, zoals seedr, die de torrent voor je downloadt. Als je een webclient gebruikt, kun je torrents bekijken zonder te downloaden. U hoeft alleen maar een account in seedr aan te maken en de magneetlink daarheen te kopiëren. U kunt het bestand downloaden of ze rechtstreeks naar de VLC-speler streamen zonder te downloaden. Ik gebruik liever een webclient zoals seedr om torrents te downloaden.

  <b>Stuur trefwoorden om naar torrents te zoeken.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Voor inline zoeken typ je gewoon @TorrentHuntBot in een chat en zoek je naar torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
