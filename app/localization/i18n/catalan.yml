help: |-
  <b>{}

  ⬇️ Com descarregar torrents?</b>

  Per descarregar els torrents, heu d’instal·lar qualsevol client torrent al vostre dispositiu. Hi ha molts clients torrent. Alguns dels meus preferits són qBitTorrent (per a PC) i Flud (per a Android). Després d’instal·lar-lo, només heu de copiar l’enllaç magnet o carregar el fitxer .Torrent a l’aplicació i el torrent començarà a descarregar-se.

  A més, podeu utilitzar un client de torrent web, com seedr, que us descarregarà el torrent. L’ús d’un client web us permetrà veure torrents sense descarregar. Només heu de crear un compte a seedr i copiar-hi l'enllaç magnet. Podeu descarregar el fitxer o transmetre'ls directament al reproductor VLC sense descarregar-lo. Prefereixo fer servir un client web com seedr per descarregar torrents.

  <b>Envieu qualsevol paraula clau per cercar torrents.</b>

  Eg: <code>VLC Media</code>, <code>Sintel</code>

  <b>Per a la cerca en línia, només cal que escriviu @TorrentHuntBot en qualsevol xat i cerqueu torrents.</b>

  Eg: <code>@TorrentHuntBot Sintel</code>
